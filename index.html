<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="QA Retest" />
    <title>QA Retest</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="QA Retest home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 2.5 20 7v10l-8 4.5L4 17V7l8-4.5Z" />
              <path d="m8.5 12 2.2 2.2 4.8-5" />
            </svg>
          </span>
          <span class="brand-name">QA Retest</span>
        </a>

        <nav class="primary-nav" aria-label="Primary navigation">
          <a class="nav-link is-active" href="#overview" aria-current="page">Overview</a>
          <a class="nav-link" href="#activity">Activity</a>
          <a class="nav-link" href="#resources">Resources</a>
        </nav>

        <div class="header-actions">
          <a class="profile-link" href="#profile" aria-label="Open profile">
            <span class="avatar" aria-hidden="true">QR</span>
            <span class="profile-name">QA Retest</span>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="m4 6 4 4 4-4" />
            </svg>
          </a>
        </div>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-navigation">
          <span class="sr-only">Open navigation</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>

      <nav class="mobile-nav" id="mobile-navigation" aria-label="Mobile navigation" hidden>
        <a class="nav-link is-active" href="#overview" aria-current="page">Overview</a>
        <a class="nav-link" href="#activity">Activity</a>
        <a class="nav-link" href="#resources">Resources</a>
        <a class="nav-link" href="#profile">Profile</a>
      </nav>
    </header>

    <main id="main-content" class="page-content">
      <section id="overview" aria-labelledby="page-title">
        <p class="eyebrow">Workspace</p>
        <h1 id="page-title">Overview</h1>
        <p class="page-intro">Your QA Retest workspace.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
